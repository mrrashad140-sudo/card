<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Card</title>
<style>
:root{--accent:#c9a24b;--bg:#0f1b2d;--card:#16263d;--text:#f2f4f8;--muted:#9fb0c7}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;padding:24px 14px}
.wrap{width:100%;max-width:420px}
.card{background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.top{height:90px;background:linear-gradient(135deg,var(--accent),#7a5d1c)}
.avatar{width:104px;height:104px;border-radius:50%;margin:-52px auto 0;border:4px solid var(--card);background:#223552;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:700;color:var(--accent);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.info{text-align:center;padding:14px 22px 6px}
h1{font-size:23px}
.role{color:var(--accent);margin-top:4px;font-size:15px}
.company{color:var(--muted);font-size:13px;margin-top:2px}
.tag{color:var(--muted);font-size:13.5px;line-height:1.7;margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:10px 20px 4px}
.chips span{font-size:12px;border:1px solid #2c4468;border-radius:99px;padding:4px 10px;color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 20px 6px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 8px;border-radius:12px;background:#1d3250;color:var(--text);text-decoration:none;font-size:14px;border:0;cursor:pointer;font-family:inherit}
.btn:hover{background:#25406a}
.btn.primary{background:var(--accent);color:#1a1405;font-weight:700;grid-column:1/-1}
.btn.primary:hover{filter:brightness(1.08)}
.qr{text-align:center;padding:18px 20px 22px}
.qr .box{display:inline-block;background:#fff;padding:12px;border-radius:14px}
.qr .box svg{display:block;width:170px;height:170px}
.qr p{color:var(--muted);font-size:12.5px;margin:8px 0 10px}
.small{font-size:12.5px;padding:8px 14px;display:inline-flex;margin:0 auto}
.foot{text-align:center;color:#5f7391;font-size:11px;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="top"></div>
    <div class="avatar" id="avatar"></div>
    <div class="info">
      <h1 id="name"></h1>
      <div class="role" id="role"></div>
      <div class="company" id="company"></div>
      <div class="tag" id="tagline"></div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="actions" id="actions"></div>
    <div class="qr">
      <div class="box" id="qrbox"></div>
      <p id="qrnote"></p>
      <button class="btn small" id="dlqr"></button>
    </div>
  </div>
  <div class="foot" id="foot"></div>
</div>

<script src="qr.js"></script>
<script>
/* ============ CONFIG: عدّل هذه الكتلة فقط ============ */
const CONFIG = {
  lang: "ar",                       // "ar" أو "en"
  name: "محمد رمضان رشاد",
  title: "مدير مالي",
  company: "بيد نجد للاستيراد",
  tagline: "خبرة تزيد عن 15 عامًا في المحاسبة المالية والتكاليف والإدارة المالية.",
  services: ["التحليل المالي", "النمذجة المالية", "Dashboards"],
  phone: "+201028701523",           // بصيغة دولية
  whatsapp: "201028701523",         // رقم بدون + أو مسافات
  email: "mrrashad140@gmail.com",
  website: "",
  linkedin: "https://www.linkedin.com/in/mohamed-r-rashad-9abaa422a",
  address: "",                      // اختياري
  photo: "photo.jpg",                      // اختياري: رابط صورة أو data URL
  accent: "#c9a24b",                // لون الهوية
  cardUrl: "https://mrrashad140-sudo.github.io/card/"                       // رابط الكارت بعد النشر؛ لو فاضي يستخدم رابط الصفحة الحالي
};
/* ===================================================== */

const T = {
  ar:{dir:"rtl",save:"💾 حفظ جهة الاتصال",call:"📞 اتصال",wa:"💬 واتساب",mail:"✉️ إيميل",web:"🌐 الموقع",li:"in لينكدإن",share:"🔗 مشاركة",
      qrnote:"امسح الكود لفتح الكارت",dl:"⬇️ تحميل الـ QR",copied:"تم نسخ الرابط"},
  en:{dir:"ltr",save:"💾 Save contact",call:"📞 Call",wa:"💬 WhatsApp",mail:"✉️ Email",web:"🌐 Website",li:"in LinkedIn",share:"🔗 Share",
      qrnote:"Scan to open this card",dl:"⬇️ Download QR",copied:"Link copied"}
}[CONFIG.lang] || {};
const C = CONFIG, $ = id => document.getElementById(id);
document.documentElement.lang = C.lang; document.documentElement.dir = T.dir;
document.documentElement.style.setProperty("--accent", C.accent);
document.title = C.name + " | " + C.title;

$("name").textContent = C.name; $("role").textContent = C.title;
$("company").textContent = C.company; $("tagline").textContent = C.tagline;
if (C.photo){ const i=document.createElement("img"); i.src=C.photo; i.alt=C.name; $("avatar").appendChild(i); }
else { $("avatar").textContent = (C.name.trim()[0]||"?"); }
(C.services||[]).forEach(s=>{const e=document.createElement("span");e.textContent=s;$("chips").appendChild(e);});

function btn(label, href, cls, ext){
  const a=document.createElement("a"); a.className="btn "+(cls||""); a.textContent=label; a.href=href;
  if(ext){a.target="_blank";a.rel="noopener";} return a;
}
const A = $("actions");
const save = document.createElement("button"); save.className="btn primary"; save.textContent=T.save; save.onclick=saveVCard; A.appendChild(save);
if (C.phone) A.appendChild(btn(T.call,"tel:"+C.phone));
if (C.whatsapp) A.appendChild(btn(T.wa,"https://wa.me/"+C.whatsapp.replace(/\D/g,""),"",true));
if (C.email) A.appendChild(btn(T.mail,"mailto:"+C.email));
if (C.website) A.appendChild(btn(T.web,C.website,"",true));
if (C.linkedin) A.appendChild(btn(T.li,C.linkedin,"",true));
const sh = document.createElement("button"); sh.className="btn"; sh.textContent=T.share; sh.onclick=share; A.appendChild(sh);

function esc(s){return String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");}
function saveVCard(){
  const parts = C.name.trim().split(/\s+/); const last = parts.length>1 ? parts.pop() : ""; const first = parts.join(" ");
  const L = ["BEGIN:VCARD","VERSION:3.0","N:"+esc(last)+";"+esc(first)+";;;","FN:"+esc(C.name)];
  if(C.company) L.push("ORG:"+esc(C.company));
  if(C.title) L.push("TITLE:"+esc(C.title));
  if(C.phone) L.push("TEL;TYPE=CELL:"+C.phone);
  if(C.email) L.push("EMAIL:"+C.email);
  if(C.website) L.push("URL:"+C.website);
  if(C.linkedin) L.push("URL:"+C.linkedin);
  if(C.address) L.push("ADR;TYPE=WORK:;;"+esc(C.address)+";;;;");
  L.push("END:VCARD");
  const blob = new Blob([L.join("\r\n")],{type:"text/vcard;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=(C.name.replace(/\s+/g,"_")||"contact")+".vcf"; document.body.appendChild(a); a.click(); a.remove();
}
const url = C.cardUrl || location.href.split("#")[0];
async function share(){
  try{ if(navigator.share){ await navigator.share({title:C.name,text:C.title,url}); return; } }catch(e){ return; }
  try{ await navigator.clipboard.writeText(url); alert(T.copied); }catch(e){ prompt("",url); }
}

/* QR */
const qr = qrcode(0,"M"); qr.addData(url); qr.make();
$("qrbox").innerHTML = qr.createSvgTag({cellSize:4, margin:0, scalable:true});
$("qrnote").textContent = T.qrnote; $("dlqr").textContent = T.dl;
$("dlqr").onclick = function(){
  const n = qr.getModuleCount(), cell = 12, m = 3, size = (n+2*m)*cell;
  const cv = document.createElement("canvas"); cv.width = cv.height = size;
  const g = cv.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,size,size); g.fillStyle="#000";
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(qr.isDark(r,c)) g.fillRect((c+m)*cell,(r+m)*cell,cell,cell);
  const a=document.createElement("a"); a.href=cv.toDataURL("image/png"); a.download="card-qr.png"; a.click();
};
</script>
</body>
</html>
